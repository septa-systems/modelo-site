name: Site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    name: Site (formatação, checagem e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
